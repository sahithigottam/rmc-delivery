services:
  - type: web
    name: rmc-delivery-backend
    repo: https://github.com/sahithigottam/rmc-delivery.git
    branch: dev-branch-2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./rmc_delivery.db
      - key: LOG_LEVEL
        value: INFO
      - key: GOOGLE_MAPS_API_KEY
        value: ${GOOGLE_MAPS_API_KEY}
