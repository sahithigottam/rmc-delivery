$schema: https://railway.app/railway.schema.json

build:
  builder: dockerfile
  
start:
  cmd: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  
variables:
  PORT: 8000
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  ENV: production
  LOG_LEVEL: INFO
  DATABASE_URL: sqlite:///./rmc_delivery.db
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
